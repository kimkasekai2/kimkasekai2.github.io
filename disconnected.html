<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 12 Versi Web - Solusi Masalah Koneksi Jaringan</title> <!-- Optimasi: mengubah judul halaman agar memuat kata kunci -->
    <meta name="description" content="Solusi masalah koneksi jaringan Windows 12 Versi Web. Memberikan bantuan dan saran tentang koneksi jaringan."> <!-- Optimasi: menambahkan meta tag deskriptif -->
    <style>
        * {
            padding: 0;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }
        
        html,body {
            width: 100%;
            height: 100%;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: max(60%, 600px);
            padding: 50px;
        }

        .container * {
            margin: 20px 0;
        }

        .container .tit {
            font-weight: 700;
            font-size: 1.56em;
            padding: 5px 0;
        }

        .container p.bold {
            font-weight: 700;
            font-size: 1.2em;
        }

        .container p.last {
            font-size: 0.85em;
            color: #888888;
            margin-top: 30px;
        }

        .container ul {
            list-style-position: inside;
        }

        .container>.pic {
            width: 100px;
            height: 100px;
            background-image: url("apps/icons/edge/disconnected.svg");
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center; 
            /* Optimasi: memusatkan gambar latar belakang */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="pic"></div>
        <div class="tit">Masalah koneksi jaringan</div> <!-- Optimasi: judul yang lebih spesifik -->
        <div class="content">
            <p>Web berbeda karena ada Anda. Mari kami bantu Anda kembali online!</p>
            <p class="bold">Coba langkah-langkah berikut:</p> <!-- Optimasi: saran yang lebih spesifik -->
            <ul>
                <li>Periksa kabel jaringan, modem, dan router</li>
                <li>Sambungkan kembali ke jaringan nirkabel</li>
            </ul>
            <p class="last">Kode kesalahan: ERR_INTERNET_DISCONNECTED</p> <!-- Optimasi: memberikan penjelasan kode kesalahan -->
        </div>
    </div>
</body>
</html>
